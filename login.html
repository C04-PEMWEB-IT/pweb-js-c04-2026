<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mini Shopee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <h2>Masuk ke Akunmu</h2>
            <p>Gunakan username & password akunmu.</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username..." required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password..." required autocomplete="current-password">
            </div>

            <div id="errorMessage" class="error-message hidden"></div>

            <button type="submit" id="submitBtn" class="btn-primary">
                <span id="btnText">Masuk</span>
                <span id="loadingSpinner" class="spinner hidden"></span>
            </button>
        </form>
        
        <div class="login-footer">
            <small>Shopee, shopee apa yang sombong? Shopintar</small>
        </div>
    </div>
    <script src="login.js" defer></script>
</body>
</html>
